<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm2Connect - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<header>
    <div class="logo">
    <img src="images/farm2connect-logo.png" alt="Farm2Connect Logo" class="logo-img">
    <span>Farm2Connect</span>
</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
        <a href="register.html">Register</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main>
    <section class="dashboard">

        <h1>Welcome, <span id="userName"></span>!</h1>

        <p id="userRole"></p>

        <div id="adminButtons" class="dashboard-buttons" style="display: none;">
    <button id="manageUsersBtn">👥 Manage Users</button>
    <button id="manageProductsBtn">🌾 Manage Products</button>
    <button id="viewAllOrdersBtn">📦 View All Orders</button>
</div>

        <div class="dashboard-buttons">

            <button id="productsBtn">
                🌾 My Products
            </button>

            <button id="searchBtn">
                🔍 Search Produce
            </button>

            <button id="ordersBtn">
                📦 My Orders
            </button>

            <button id="requestsBtn">
                📋 My Requests
            </button>

            <button id="logoutBtn">
                🚪 Logout
            </button>

        </div>

    </section>
</main>

<script src="js/dashboard.js"></script>

</body>
</html>
