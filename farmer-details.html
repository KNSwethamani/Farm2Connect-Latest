
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Details - Farm2Connect</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .details-page {
            max-width: 1000px;
            margin: 35px auto;
            padding: 20px;
        }

        .details-heading {
            text-align: center;
            color: #166534;
            margin-bottom: 25px;
        }

        .details-layout {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 24px;
            align-items: start;
        }

        .details-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.07);
        }

        .farmer-profile-icon {
            width: 76px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #dcfce7;
            border-radius: 50%;
            font-size: 38px;
            margin-bottom: 15px;
        }

        .details-card h2 {
            color: #166534;
            margin-top: 0;
        }

        .farmer-info-row {
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
            overflow-wrap: anywhere;
        }

        .farmer-info-row span {
            display: block;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .farmer-info-row strong {
            color: #1f2937;
        }

        .product-section-title {
            color: #166534;
            margin-top: 0;
        }

        .farmer-product-card {
            border: 1px solid #dcfce7;
            background: #f8fffa;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 16px;
        }

        .product-title {
            font-size: 21px;
            color: #166534;
            margin: 0 0 15px;
        }

        .product-highlights {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .product-highlight {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 12px;
        }

        .product-highlight span {
            display: block;
            color: #64748b;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .product-highlight strong {
            color: #166534;
            font-size: 17px;
        }

        .product-description {
            color: #475569;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .details-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .details-actions button {
            width: 100%;
            padding: 13px 10px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        #contactFarmerBtn {
            background: #dcfce7;
            color: #166534;
        }

        #buyProductBtn {
            background: #15803d;
            color: #fff;
        }

        .details-actions button:hover {
            filter: brightness(0.96);
        }

        @media (max-width: 700px) {
            .details-layout {
                grid-template-columns: 1fr;
            }

            .details-page {
                margin: 15px auto;
                padding: 14px;
            }

            .details-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Farm2Connect</h1>
        <p>Fresh from farmers, directly to you</p>
    </header>

    <main class="details-page">
        <h2 class="details-heading">Farmer & Product Details</h2>

        <div class="details-layout">
            <section class="details-card">
                <div class="farmer-profile-icon">👨‍🌾</div>
                <h2 id="farmerName">Loading...</h2>

                <div class="farmer-info-row">
                    <span>Role</span>
                    <strong id="farmerRole">Farmer</strong>
                </div>

                <div class="farmer-info-row">
                    <span>Phone</span>
                    <strong id="farmerPhone">Loading...</strong>
                </div>

                <div class="farmer-info-row">
                    <span>Email</span>
                    <strong id="farmerEmail">Loading...</strong>
                </div>
            </section>

            <section class="details-card">
                <h2 class="product-section-title">🌿 Available Products</h2>

                <div id="farmerProducts">
                    Loading products...
                </div>

                <div class="details-actions">
                    <button id="contactFarmerBtn">CONTACT FARMER</button>
                    <button id="buyProductBtn">BUY / PLACE ORDER</button>
                </div>
            </section>
        </div>
    </main>

    <script src="js/farmer-details.js"></script>
</body>
</html>
